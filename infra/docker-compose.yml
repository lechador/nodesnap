services:
  caddy:
    image: caddy:2
    environment:
      DOMAIN: "${DOMAIN:-}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
  web:
    build:
      context: ../apps/web
      args: { NODESNAP_API: "http://api:8000" }
    environment: { NODESNAP_API: "http://api:8000" }
    depends_on: [api]
  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment:
      DATABASE_URL: "postgresql+psycopg://nodesnap:${POSTGRES_PASSWORD:-nodesnap}@postgres:5432/nodesnap"
      ARTIFACT_ROOT: "/data/artifacts"
      META_API_KEY: "${META_API_KEY:-}"
      META_BASE_URL: "${META_BASE_URL:-https://api.meta.ai/v1}"
      META_REASONING_MODEL: "${META_REASONING_MODEL:-muse-wonder-1.0}"
      META_TRANSCRIPTION_MODEL: "${META_TRANSCRIPTION_MODEL:-muse-voice-transcribe-1.0}"
      APP_SPEND_CEILING_USD: "${APP_SPEND_CEILING_USD:-135}"
    volumes: ["artifacts:/data/artifacts"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: nodesnap, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nodesnap}", POSTGRES_DB: nodesnap }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    volumes: ["redisdata:/data"]
volumes: { pgdata: {}, redisdata: {}, artifacts: {}, caddy_data: {}, caddy_config: {} }
