[project]
name = "nodesnap-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "nodesnap-domain",
  "nodesnap-geometry",
  "nodesnap-engineering",
  "nodesnap-reports",
]

[tool.uv.sources]
nodesnap-domain = { workspace = true }
nodesnap-geometry = { workspace = true }
nodesnap-engineering = { workspace = true }
nodesnap-reports = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
