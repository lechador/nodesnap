[project]
name = "nodesnap-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "nodesnap-domain",
  "nodesnap-geometry",
  "nodesnap-engineering",
  "nodesnap-reports",
]

[tool.uv.sources]
nodesnap-domain = { workspace = true }
nodesnap-geometry = { workspace = true }
nodesnap-engineering = { workspace = true }
nodesnap-reports = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
