[project]
name = "nodesnap-engineering"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9","shapely>=2.0","numpy>=1.26","nodesnap-domain","nodesnap-geometry"]

[tool.uv.sources]
nodesnap-domain = { workspace = true }
nodesnap-geometry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering"]
