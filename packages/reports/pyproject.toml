[project]
name = "nodesnap-reports"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9","reportlab>=4.2","nodesnap-domain","nodesnap-engineering","nodesnap-geometry"]

[tool.uv.sources]
nodesnap-domain = { workspace = true }
nodesnap-engineering = { workspace = true }
nodesnap-geometry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reports"]
